services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # KRaft Configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
  
  jobmanager:
    image: flink:2.3
    container_name: jobmanager
    depends_on:
      - kafka
      - elasticsearch
      - cassandra-1
      - cassandra-2
      - cassandra-3
      - minio
    ports:
      - "8081:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./log-processing-service/target/log-processing-service-1.0-SNAPSHOT.jar:/opt/flink/log-processing-service-1.0-SNAPSHOT.jar
      - ./log-processing-service/docker/flink-checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

  taskmanager:
    image: flink:2.3
    container_name: taskmanager
    depends_on:
      - jobmanager
    ports:
      - "9250:9250"
    command: taskmanager
    volumes:
      - ./log-processing-service/docker/flink-checkpoints:/opt/flink/checkpoints
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
    restart: unless-stopped

    taskmanager-2:
      image: flink:2.3
      container_name: taskmanager-2
      depends_on:
        - jobmanager
      ports:
        - "9251:9250"
      command: taskmanager
      volumes:
        - ./log-processing-service/docker/flink-checkpoints:/opt/flink/checkpoints
      environment:
        FLINK_PROPERTIES: |
          jobmanager.rpc.address: jobmanager
          taskmanager.numberOfTaskSlots: 2
          metrics.reporters: prom
          metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
          metrics.reporter.prom.port: 9250
      restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    depends_on:
      - file-ingestion-service
    ports:
      - "2020:2020"
    volumes:
      - ./file-ingestion-service/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./file-ingestion-service/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - uploads-data:/app/uploads
    restart: unless-stopped
  
  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  file-ingestion-service:
    image: eclipse-temurin:17-jdk
    depends_on:
      - kafka
    container_name: file-ingestion-service
    volumes:
      - ./file-ingestion-service/target/file-ingestion-service-0.0.1-SNAPSHOT.jar:/app/app.jar
      - uploads-data:/app/uploads
    working_dir: /app
    command: java -jar app.jar
    ports:
      - "8080:8080"
    restart: unless-stopped

  agent-based-service:
    image: eclipse-temurin:17-jdk
    depends_on:
      - kafka
      - redis
    container_name: agent-based-service
    volumes:
      - ./agent-based-service/target/agent-based-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    ports:
      - "8082:8082"
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "/kafka-init.sh"]
    volumes:
      - ./log-processing-service/docker/kafka-init.sh:/kafka-init.sh

  elasticsearch-init:
    image: curlimages/curl:8.14.1
    depends_on:
      - elasticsearch
    entrypoint: ["sh", "/elasticsearch-init.sh"]
    volumes:
      - ./log-processing-service/docker/elasticsearch-init.sh:/elasticsearch-init.sh
  
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./log-processing-service/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - jobmanager
      - taskmanager
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: logging-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-1-data:/var/lib/cassandra
    restart: unless-stopped

  cassandra-2:
    image: cassandra:5.0
    container_name: cassandra-2
    hostname: cassandra-2
    depends_on:
      - cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: logging-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-2-data:/var/lib/cassandra
    restart: unless-stopped

  cassandra-3:
    image: cassandra:5.0
    container_name: cassandra-3
    hostname: cassandra-3
    depends_on:
      - cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: logging-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-3-data:/var/lib/cassandra
    restart: unless-stopped

volumes:
  kafka-data:
  uploads-data:
  elasticsearch-data:
  redis-data:
  minio_data:
  cassandra-1-data:
  cassandra-2-data:
  cassandra-3-data: