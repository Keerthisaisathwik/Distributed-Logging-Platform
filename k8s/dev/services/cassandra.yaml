apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  labels:
    app.kubernetes.io/name: cassandra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: intra-node
      port: 7000
      targetPort: intra-node
    - name: cql
      port: 9042
      targetPort: cql
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels:
    app.kubernetes.io/name: cassandra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: cql