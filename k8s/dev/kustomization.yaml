apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: fluent-bit-config
    files:
      - config/fluent-bit.conf

  - name: fluent-bit-parsers
    files:
      - config/parsers.conf

resources:
  # Storage
  - storage/kafka-pvc.yaml
  - storage/minio-pvc.yaml

  # ConfigMaps
  - configmaps/cassandra.yaml
  - configmaps/elasticsearch.yaml
  - configmaps/minio.yaml
  - configmaps/flink.yaml

  # NetworkPolicies
  - networkpolicies/cassandra-network-policy.yaml

  # RBAC
  - rbac/flink.yaml
  - rbac/cassandra-service-account.yaml

  # Services
  - services/cassandra.yaml
  - services/elasticsearch.yaml
  - services/file-ingestion.yaml
  # - services/log-processing.yaml (not needed)
  - services/kafka.yaml
  - services/minio.yaml
  - services/flink.yaml

  # StatefulSets
  - statefulsets/kafka.yaml
  - statefulsets/elasticsearch.yaml
  - statefulsets/cassandra.yaml
  - statefulsets/minio.yaml

  # Jobs
  - jobs/cassandra-authorization.yaml
  - jobs/cassandra-init.yaml
  - jobs/elasticsearch-init.yaml
  - jobs/jobmanager.yaml
  - jobs/kafka-init.yaml
  - jobs/minio-init.yaml

  # PDBs
  - pdbs/flink.yaml

  # Deployments
  - deployments/file-ingestion.yaml
  # - deployments/log-processing.yaml (not needed)
  - deployments/taskmanager.yaml