apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: cassandra-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 60
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: cassandra
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cassandra
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cassandra
      containers:
        - name: cassandra
          image: cassandra:5.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/entrypoint.sh"]
          ports:
            - name: intra-node
              containerPort: 7000
            - name: cql
              containerPort: 9042
          envFrom:
            - configMapRef:
                name: cassandra-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_LISTEN_ADDRESS
              value: "$(POD_IP)"
            - name: CASSANDRA_BROADCAST_ADDRESS
              value: "$(POD_IP)"
            - name: CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: cassandra-admin-credentials
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassandra-admin-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "nodetool drain"]
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  nodetool status 2>/dev/null | grep -qE "^UN\s+${POD_IP}\s"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  nodetool status 2>/dev/null | grep -qE "^UN\s+${POD_IP}\s"
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: intra-node
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: cassandra-scripts
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: cassandra
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cassandra
  labels:
    app.kubernetes.io/name: cassandra
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra