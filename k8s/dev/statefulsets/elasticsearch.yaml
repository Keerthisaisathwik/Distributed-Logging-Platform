apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 3
  podManagementPolicy: Parallel

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: elasticsearch

      initContainers:
        - name: set-vm-max-map-count
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=1048576"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300

          env:
            - name: ES_JAVA_OPTS
              value: "-Xms2g -Xmx2g"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true

          startupProbe:
            exec:
              command:
                - bash
                - -c
                - "curl -s -k -u \"elastic:${ELASTIC_PASSWORD}\" -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -q 200"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "curl -s -k -u \"elastic:${ELASTIC_PASSWORD}\" https://localhost:9200/_cluster/health?local=true | grep -vq '\"status\":\"red\"'"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "curl -s -k -u \"elastic:${ELASTIC_PASSWORD}\" -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -q 200"
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

      volumes:
        - name: config
          configMap:
            name: elasticsearch
        - name: certs
          secret:
            secretName: elasticsearch-certs

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: elasticsearch
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 30Gi