apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-bootstrap-auth
  labels:
    app.kubernetes.io/name: cassandra-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra-bootstrap
        cassandra-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: cassandra
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: cassandra:5.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/bootstrap-auth.sh"]
          envFrom:
            - configMapRef:
                name: cassandra-config
          env:
            - name: HOME
              value: /tmp
            - name: EXPECTED_NODES # keep equal to the initial StatefulSet replicas
              value: "1"
            - name: SYSTEM_AUTH_RF
              value: "1"
            - name: CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: cassandra-admin-credentials
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassandra-admin-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: cassandra-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}