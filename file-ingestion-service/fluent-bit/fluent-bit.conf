[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      info
    Parsers_File   parsers.conf
    HTTP_Server    On
    HTTP_Listen    0.0.0.0
    HTTP_Port      2020
    Scheduler.Base 3
    Scheduler.Cap  30
    storage.path /var/lib/fluent-bit/storage

[INPUT]
    Name              tail
    Path              Path /app/uploads/logs/*/*/*.log
    Tag               logs.app
    Parser            log_parser
    Read_From_Head    true
    Path_Key          _source_file
    Offset_Key        _source_offset


[INPUT]
    Name              tail
    Path              Path /app/uploads/logs/*/*/*.json
    Tag               logs.json
    Parser            json_parser
    Read_From_Head    true
    Path_Key          _source_file
    Offset_Key        _source_offset


