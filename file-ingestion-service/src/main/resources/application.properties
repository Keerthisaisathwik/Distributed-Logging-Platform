spring.application.name=file-ingestion-service

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.batch.size=65536
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.acks=all

kafka.topic.logs-raw=logs.raw

file.upload-dir=/app/uploads

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.probes.enabled=true

snowflake.machine-id=${MACHINE_ID}

# Delivery mode: AT_MOST_ONCE or AT_LEAST_ONCE
ingestion.delivery-mode=AT_LEAST_ONCE

# Application-level retry policy
ingestion.retry.max-retries=5
ingestion.retry.initial-delay-ms=500
ingestion.retry.max-delay-seconds=30

file.storage.root=/app/uploads/logs